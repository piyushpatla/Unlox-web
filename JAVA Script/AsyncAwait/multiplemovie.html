<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      *{

      margin: 0;

      padding: 0;

      box-sizing: border-box;

      font-family: Arial, Helvetica, sans-serif;

    }

    body{

      background: #0f172a;

      color: white;

      min-height: 100vh;

      padding: 30px;

    }

    h1{

      text-align: center;

      margin-bottom: 30px;

      font-size: 45px;

      color: #38bdf8;

    }

    .search-box{

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-bottom: 40px;

      flex-wrap: wrap;

    }

    .search-box input{

      width: 300px;

      padding: 14px;

      border: none;

      outline: none;

      border-radius: 10px;

      font-size: 16px;

    }

    .search-box button{

      padding: 14px 20px;

      border: none;

      background: #38bdf8;

      color: white;

      font-size: 16px;

      border-radius: 10px;

      cursor: pointer;

      transition: 0.3s;

    }

    .search-box button:hover{

      background: #0284c7;

      transform: scale(1.05);

    }

    #movieContainer{

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

      gap: 25px;

    }

    .movie{

      background: #1e293b;

      padding: 20px;

      border-radius: 15px;

      text-align: center;

      transition: 0.3s;

      box-shadow: 0px 5px 15px rgba(0,0,0,0.3);

    }

    .movie:hover{

      transform: translateY(-8px);

    }

    .movie img{

      width: 100%;

      height: 350px;

      object-fit: cover;

      border-radius: 10px;

      margin-top: 15px;

    }

    .movie h2{

      margin-bottom: 10px;

      font-size: 24px;

      color: #f8fafc;

    }

    .movie p{

      color: #cbd5e1;

      margin-bottom: 10px;

      font-size: 18px;

    }

    .error{

      text-align: center;

      font-size: 25px;

      color: red;

      margin-top: 30px;

    }

    @media(max-width:500px){

      h1{

        font-size: 32px;

      }

      .search-box input{

        width: 100%;

      }

      .search-box button{

        width: 100%;

      }

    }
    </style>
</head>
<body>
   
  <h1>🎬 Movie Search App</h1>

  <div class="search-box">

    <input type="text" id="movieInput" placeholder="Search Movies..." />

    <button onclick="HandleSearch()">Search</button>

  </div>

  <div id="movieContainer"></div>

    <script>
        async function getMovie(movieName) {
            let url = `http://www.omdbapi.com/?s=${movieName}&apikey=a6606658`

            try{

                let response = await fetch(url)
                let data = await response.json()

                console.log(data)

                const movieContainer = document.getElementById("movieContainer")

                movieContainer.innerHTML = ""

                if(data.Response == "True"){
                    data.Search.forEach((movie) =>{

                    movieContainer.innerHTML+=`
                    <div class="movie">
                    <h2>${movie.Title}</h2>
                    <p>📅 ${movie.Year}</p>
                    <img src="${movie.Poster}" alt="${movie.Title}" />
                    </div>
                    <br>
                    `
                    })   
                }else{
                     movieContainer.innerHTML = `
                      <h2 class="error">Movie Not Found 😢</h2>
                     `
                }

               }catch(error){
                console.log("Error Fetching Movie " , error)
            }

        }

        function HandleSearch(){
            const movieName = document.getElementById("movieInput").value

            if(movieName){
                getMovie(movieName)

            }else{
                alert("Please Enter Movie Name")
            }
        }
    </script>
</body>
</html>
