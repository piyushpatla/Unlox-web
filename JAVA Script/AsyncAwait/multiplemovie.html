<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .movie{
            border: 1px solid black;
            padding: 20px;
            margin-top: 20px;
            max-width: 500px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Movie App</h1>

    <input type="text" id="movieInput" placeholder="Enter Movie Name">
    <button onclick="HandleSearch()">Search Movie</button>

    <div class="movie" id="movieContainer">

    </div>

    <script>
        async function getMovie(movieName) {
            let url = `http://www.omdbapi.com/?s=${movieName}&apikey=a6606658`

            try{

                let response = await fetch(url)
                let data = await response.json()

                console.log(data)

                const movieContainer = document.getElementById("movieContainer")

                movieContainer.innerHTML = ""

                if(data.Response == "True"){
                    data.Search.forEach((movie) =>{

                    movieContainer.innerHTML+=`
                    <div class = "movie">
                    <h2>${movie.Title}</h2>
                    <p>${movie.Year}</p>
                    <img src="${movie.Poster}" width = "200">
                    </div>

                    <br>
                    `
                    })   
                }else{
                    movieContainer.innerHTML=` <h2> Movie Not Found</h2>`
                }

            }catch(error){
                console.log("Error Fetching Movie " , error)
            }

        }

        function HandleSearch(){
            const movieName = document.getElementById("movieInput").value

            if(movieName){
                getMovie(movieName)

            }else{
                alert("Please Enter Movie Name")
            }
        }
    </script>
</body>
</html>
