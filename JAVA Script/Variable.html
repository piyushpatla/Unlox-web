<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>


    //1.  keyword - var
       //  Syntax - VariableType VariableName = Value
        var username ="Piyush"
        console.log(username)

        var age = 24
        console.log(age)

    //Disadvantage of var keyword

     var phonenumber = 345678

     var phonenumber = 987654


     console.log(phonenumber)


    //2. keyword - let

      let email = "abc@gmail.com"

      //let email = "xyz@gamil,com" - Throw Error because using same variable name that is email along with let

      console.log(email)

      //Disadvantage of let keyword- If you used the same variablename without using let keyword it will update the vaule

      let review = 4.5

      review = 2.5

      console.log(review)

    //3. keyword - const

        const abc = "hello guys"

        console.log(abc)

    </script>
